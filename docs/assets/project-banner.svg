<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
<title id="title">Multi-Agent Study Guide: V1 to V17</title>
<desc id="description">A complete local learning project progressing from sequential Python agents to LangGraph, trusted retrieval, tools, durable human review, and Review Studio. Baseline v17.0.0 completed November 3, 2026.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b162c"/><stop offset="1" stop-color="#12354b"/></linearGradient><linearGradient id="accent"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
