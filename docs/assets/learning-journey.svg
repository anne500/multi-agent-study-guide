<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
<title id="title">The seven-stage V1 to V17 learning journey</title>
<desc id="description">Seven numbered stages: foundations V1 to V3, coordination V4 to V6, control V7 to V8, reliability V9 to V10, context V11 to V13, adaptation V14 to V16, and delivery V17. All are complete for the local single-user scope.</desc>
