<text x="30" y="43" fill="#102b3c" font-size="20" font-weight="700" >SEVENTEEN VERSIONS. SEVEN LEARNING STAGES.</text>
<text x="30" y="75" fill="#475569" font-size="17" font-weight="400" >Follow the numbered stages, or open any version as a separate example.</text>
