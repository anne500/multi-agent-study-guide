name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.12', '3.14']
    env:
      PYTHONUTF8: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-v17.lock
      - name: Install dependencies
        run: python -m pip install -r requirements-v17.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Record environment
        run: |
          python --version
          python -m pip freeze
      - name: Compile project Python files
        run: python scripts/ci_checks.py --compile-only
      - name: Run offline regression scripts
        run: python scripts/ci_checks.py --tests-only

  docker-smoke:
    name: Docker readiness and persisted review
    needs: offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Record Docker environment
        run: docker version
      - name: Build V17 image
        run: docker build --file Dockerfile.v17 --tag study-guide:ci .
      - name: Verify health, API, and review resume across replacement
        run: python scripts/docker_smoke.py --image study-guide:ci
